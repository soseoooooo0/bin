name: Render lotus baby video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render MP4
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Verify source images
        run: |
          test -f assets/background.png
          test -f assets/lotus.png
          test -f assets/child.png

      - name: Render video
        run: |
          chmod +x scripts/render.sh
          scripts/render.sh

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: lotus-baby-video
          path: output/lotus-baby.mp4
          if-no-files-found: error
          retention-days: 14
