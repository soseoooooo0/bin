name: Render lotus baby video

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    name: Render MP4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install video renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Render video
        run: |
          chmod +x scripts/render.sh
          scripts/render.sh

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: lotus-baby-video
          path: output/lotus-baby.mp4
          if-no-files-found: error
          retention-days: 14
